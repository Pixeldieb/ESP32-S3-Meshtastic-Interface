; ============================================================================
; ESP32-S3 Interface for Meshtastic — multi-board project
;
; Each supported board gets its own [env:*] + its own src/<board>/main.cpp.
; Code shared across boards (currently: lage_db, the SQLite storage layer)
; lives in src/common/ and is pulled in via build_src_filter.
;
; Build/upload a specific board:
;   pio run -e seeed_xiao_esp32s3 -t upload
;   pio run -e sensecap_indicator -t upload
; ============================================================================

[platformio]
default_envs = seeed_xiao_esp32s3, sensecap_indicator

; ----------------------------------------------------------------------------
; Seeed XIAO ESP32-S3 (original board): talks to an external Meshtastic node
; (Seeed XIAO nRF52, stock Meshtastic firmware) over UART via D6/D7.
; No display — interaction is the serial CLI (see README "Serial-CLI").
; ----------------------------------------------------------------------------
[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter =
    +<xiao/>
    +<common/>
build_flags =
    -D MT_DEBUGGING
    -I src/common
lib_deps =
    https://github.com/meshtastic/Meshtastic-arduino.git#6edd5643
    siara-cc/Sqlite3Esp32

; ----------------------------------------------------------------------------
; Seeed SenseCAP Indicator (D1L): ESP32-S3 + RP2040 dual-MCU, 480x480 RGB
; touchscreen (ST7701S) with capacitive touch (FT6336U), built-in LoRa
; (SX1262) on the ESP32-S3 side — deliberately NOT used (see
; meshtastic_bridge.h). Display+touch+lage_db+Meshtastic bridge (Weg 2:
; external node, e.g. the XIAO nRF52, over GPIO22 TX/GPIO23 RX — see
; meshtastic_bridge.h for wiring) are all wired up; connection needs the
; external node physically attached to actually come online.
;
; Confirmed-working, hardware-specific settings (found by trial and error
; against this exact unit, see git history for the bring-up story):
;   - flash_mode=dio, memory_type=dio_opi (octal PSRAM) — qio variants
;     bootloop instead of reaching setup().
;   - default_8MB.csv partition table — this unit's flash is 8MB
;     (confirmed via `esptool.py flash_id`), default_16MB.csv bootloops.
;   - Panel is mounted upside down — corrected in software, see
;     sensecap/main.cpp (lvgl_disp_flush) and sensecap/touch.cpp.
;
; Pin definitions and the ST7701 bring-up sequence are adapted from the
; community reference firmware (ril3y/sensecap-indicator-d1l on GitHub),
; cross-checked against Seeed's own SenseCAP_Indicator_ESP32 SDK repo.
;
; platform is pinned to 5.4.0 (ESP-IDF 4.x): Arduino_GFX's ESP32-S3 RGB
; panel driver is documented as incompatible with ESP-IDF 5.x toolchains.
; ----------------------------------------------------------------------------
[env:sensecap_indicator]
platform = espressif32@5.4.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter =
    +<sensecap/>
    +<common/>
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
board_build.partitions = default_8MB.csv
build_flags =
    ; Classic UART0 console (matches the CH340 bridge this board exposes),
    ; not native USB CDC — keeps the port we've verified with esptool.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -I src/common
lib_deps =
    moononournation/GFX Library for Arduino@1.3.8
    lvgl/lvgl@^8.3.11
    Wire
    siara-cc/Sqlite3Esp32
    https://github.com/meshtastic/Meshtastic-arduino.git#6edd5643
    jgromes/RadioLib@^6.6.0
