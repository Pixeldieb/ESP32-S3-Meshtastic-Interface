<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10537E"/>
    </marker>
  </defs>

  <!-- Board 1: XIAO ESP32-S3 -->
  <rect x="40" y="60" width="260" height="300" rx="14" fill="#0d2b3e" stroke="#10537E" stroke-width="3"/>
  <text x="170" y="95" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">XIAO ESP32-S3</text>
  <text x="170" y="118" fill="#9fc9e0" font-size="13" text-anchor="middle">(Code / Steuerung)</text>

  <circle cx="300" cy="180" r="6" fill="#62B22E"/>
  <text x="230" y="185" fill="#ffffff" font-size="16" text-anchor="end">D6 (TX)</text>

  <circle cx="300" cy="230" r="6" fill="#62B22E"/>
  <text x="230" y="235" fill="#ffffff" font-size="16" text-anchor="end">D7 (RX)</text>

  <circle cx="300" cy="280" r="6" fill="#aaaaaa"/>
  <text x="230" y="285" fill="#ffffff" font-size="16" text-anchor="end">GND</text>

  <!-- Board 2: Meshtastic Node -->
  <rect x="600" y="60" width="260" height="300" rx="14" fill="#04413d" stroke="#04A098" stroke-width="3"/>
  <text x="730" y="95" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">Meshtastic Node</text>
  <text x="730" y="118" fill="#8fe0d8" font-size="13" text-anchor="middle">(XIAO nRF52, LoRa-Funk)</text>

  <circle cx="600" cy="230" r="6" fill="#62B22E"/>
  <text x="670" y="235" fill="#ffffff" font-size="16" text-anchor="start">RX</text>

  <circle cx="600" cy="180" r="6" fill="#62B22E"/>
  <text x="670" y="185" fill="#ffffff" font-size="16" text-anchor="start">TX</text>

  <circle cx="600" cy="280" r="6" fill="#aaaaaa"/>
  <text x="670" y="285" fill="#ffffff" font-size="16" text-anchor="start">GND</text>

  <!-- Crossed connections TX -> RX -->
  <path d="M300,180 C420,180 480,230 600,230" fill="none" stroke="#62B22E" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Crossed connections RX <- TX -->
  <path d="M600,180 C480,180 420,230 300,230" fill="none" stroke="#62B22E" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- GND straight -->
  <line x1="300" y1="280" x2="600" y2="280" stroke="#aaaaaa" stroke-width="3" stroke-dasharray="6,4"/>

  <text x="450" y="330" fill="#666666" font-size="13" text-anchor="middle">TX/RX gekreuzt · GND gemeinsam (z.B. über Breadboard-Minusschiene)</text>
  <text x="450" y="30" fill="#10537E" font-size="16" font-weight="bold" text-anchor="middle">Verkabelung (UART, gekreuzt)</text>
</svg>
