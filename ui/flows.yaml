  # ----------------------------------------------------------
  # INFORMATION
  # ----------------------------------------------------------

  - id: view_situation_information
    name: "Lageinformationen anzeigen"

    steps:
      - page: main_menu
        action: click
        target: information

      - page: information_menu
        action: click
        target: request_situation_information

      - page: situation_information
        action: view
        target: information_list

      - page: situation_information
        action: scroll
        target: scroll_up

      - page: situation_information
        action: scroll
        target: scroll_down

      - page: situation_information
        action: click
        target: back


  - id: view_crisis_staff_information
