# ============================================================
# UI FLOWS
# ============================================================

flows:

  # ----------------------------------------------------------
  # FIRE
  # ----------------------------------------------------------

  - id: report_fire
    name: "Brand melden"

    steps:
      - page: main_menu
        action: click
        target: fire_department

      - page: fire_department_menu
        action: click
        target: fire

      - page: emergency_confirmation
        action: click
        target: confirm

      - page: emergency_transmission
        action: execute
        target: meshtastic.send_emergency

      - page: emergency_details
        condition: transmission.success == true
        description: "Emergency details are displayed for manual recording."


  # ----------------------------------------------------------
  # CHEMICAL INCIDENT
  # ----------------------------------------------------------

  - id: report_chemical
    name: "Chemischen Notfall melden"

    steps:
